name: Deploy to VM

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      SERVICE_NAME: "WAHA Chatbot (${{ needs.set-environment.outputs.environment }})"
      CONTAINER_NAME: waha-chatbot-${{ needs.set-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Commits
        id: commits
        run: |
          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• `\(.id[0:7])` \(.message)"' | head -10)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Discord - Start
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Start**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 16776960
          embed-url: ${{ github.event.head_commit.url }}

      - name: Deploy via SSH
        env:
          WAHA_API_URL: ${{ secrets.WAHA_API_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          BOT_MENTIONS: ${{ secrets.BOT_MENTIONS }}
          OWNER_MENTION_ID: ${{ secrets.OWNER_MENTION_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          MAX_TOKENS: ${{ secrets.MAX_TOKENS }}
          TEMPERATURE: ${{ secrets.TEMPERATURE }}
          APP_PORT: ${{ secrets.APP_PORT }}
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_ERROR_WEBHOOK: ${{ secrets.DISCORD_ERROR_WEBHOOK }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
          CHROMA_URL: ${{ secrets.CHROMA_URL }}
          CHROMA_USERNAME: ${{ secrets.CHROMA_USERNAME }}
          CHROMA_PASSWORD: ${{ secrets.CHROMA_PASSWORD }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: CONTAINER_NAME,WAHA_API_URL,WAHA_API_KEY,WAHA_SESSION,BOT_MENTIONS,OWNER_MENTION_ID,OPENROUTER_API_KEY,OPENROUTER_MODEL,MAX_TOKENS,TEMPERATURE,APP_PORT,SERVER_DOMAIN,SERP_API_KEY,GROQ_API_KEY,DISCORD_ERROR_WEBHOOK,DISCORD_LOG_WEBHOOK,CHROMA_URL,CHROMA_USERNAME,CHROMA_PASSWORD
          script: |
            APP_DIR="$HOME/app/waha-chatbot"

            if [ -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              # Backup knowledge sebelum pull
              if [ -d "knowledge" ]; then
                cp -r knowledge /tmp/waha-knowledge-backup
              fi
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              # Restore knowledge setelah pull
              if [ -d "/tmp/waha-knowledge-backup" ]; then
                cp -r /tmp/waha-knowledge-backup knowledge
                rm -rf /tmp/waha-knowledge-backup
              fi
            else
              mkdir -p $HOME/app
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git $APP_DIR
              cd $APP_DIR
              mkdir -p knowledge
            fi

            # Generate .env from GitHub Secrets
            cat > .env <<EOL
            WAHA_API_URL=${WAHA_API_URL}
            WAHA_API_KEY=${WAHA_API_KEY}
            WAHA_SESSION=${WAHA_SESSION}
            BOT_MENTIONS=${BOT_MENTIONS}
            OWNER_MENTION_ID=${OWNER_MENTION_ID}
            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            OPENROUTER_MODEL=${OPENROUTER_MODEL}
            MAX_TOKENS=${MAX_TOKENS}
            TEMPERATURE=${TEMPERATURE}
            PORT=${APP_PORT}
            SERP_API_KEY=${SERP_API_KEY}
            GROQ_API_KEY=${GROQ_API_KEY}
            DISCORD_ERROR_WEBHOOK=${DISCORD_ERROR_WEBHOOK}
            DISCORD_LOG_WEBHOOK=${DISCORD_LOG_WEBHOOK}
            EOL


            # Build & run with Docker
            docker build -t waha-chatbot:latest .
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --env-file .env \
              -e CHROMA_URL=${CHROMA_URL} \
              -e CHROMA_USERNAME=${CHROMA_USERNAME} \
              -e CHROMA_PASSWORD=${CHROMA_PASSWORD} \
              -v $(pwd)/knowledge:/app/knowledge \
              --add-host=host.docker.internal:host-gateway \
              -p ${APP_PORT:-3001}:${APP_PORT:-3001} \
              waha-chatbot:latest

            # Setup Nginx reverse proxy
            if [ -n "$SERVER_DOMAIN" ]; then
              export SERVER_DOMAIN="${SERVER_DOMAIN}"
              export APP_PORT="${APP_PORT:-3001}"
              envsubst '${SERVER_DOMAIN} ${APP_PORT}' < nginx.conf > /tmp/waha-chatbot.conf
              sudo cp /tmp/waha-chatbot.conf /etc/nginx/sites-available/waha-chatbot
              sudo ln -sf /etc/nginx/sites-available/waha-chatbot /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx

              # SSL with Let's Encrypt (skip if already exists)
              if [ ! -d "/etc/letsencrypt/live/${SERVER_DOMAIN}" ]; then
                sudo certbot --nginx -d ${SERVER_DOMAIN} --non-interactive --agree-tos -m admin@${SERVER_DOMAIN}
              fi
            fi

      - name: Notify Discord - Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Success**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 3066993
          embed-url: ${{ github.event.head_commit.url }}

      - name: Notify Discord - Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Failed**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 15158332
          embed-url: ${{ github.event.head_commit.url }}
